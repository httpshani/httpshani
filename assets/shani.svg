<rect class="f" style="animation-delay:2.65s" x="782" y="112" width="20" height="20" rx="3" fill="#B084F5"/>
<rect class="f" style="animation-delay:2.70s" x="806" y="112" width="20" height="20" rx="3" fill="#39C5CF"/>
<rect class="f" style="animation-delay:2.75s" x="830" y="112" width="20" height="20" rx="3" fill="#C9D1D9"/>
<rect class="f" style="animation-delay:2.80s" x="662" y="136" width="20" height="20" rx="3" fill="#3B4556"/>
<rect class="f" style="animation-delay:2.85s" x="686" y="136" width="20" height="20" rx="3" fill="#FF8A80"/>
<rect class="f" style="animation-delay:2.90s" x="710" y="136" width="20" height="20" rx="3" fill="#5EE07A"/>
<rect class="f" style="animation-delay:2.95s" x="734" y="136" width="20" height="20" rx="3" fill="#FFD166"/>
<rect class="f" style="animation-delay:3.00s" x="758" y="136" width="20" height="20" rx="3" fill="#82B1FF"/>
<rect class="f" style="animation-delay:3.05s" x="782" y="136" width="20" height="20" rx="3" fill="#CDA8FF"/>
<rect class="f" style="animation-delay:3.10s" x="806" y="136" width="20" height="20" rx="3" fill="#7FE3EA"/>
<rect class="f" style="animation-delay:3.15s" x="830" y="136" width="20" height="20" rx="3" fill="#FFFFFF"/>
<!-- git log -->
<text x="48" y="336" class="p f" style="animation-delay:2.9s">~$</text>
<text x="96" y="336" clip-path="url(#c2)">git log --graph --oneline</text>
<path class="ln" d="M66 378 V498" stroke="#4C8DFF" stroke-opacity=".35" stroke-width="1.5"/>
<g class="f sl" style="animation-delay:4.20s"><circle cx="66" cy="378" r="9" fill="#4C8DFF" opacity=".18"/><circle cx="66" cy="378" r="5" fill="#4C8DFF"/><text x="96" y="384"><tspan class="h">a1f9c2e</tspan> <tspan class="hd">(HEAD -&gt; atual)</tspan> <tspan class="nm">windoh.gg</tspan> <tspan class="r">- fundador</tspan></text></g>
