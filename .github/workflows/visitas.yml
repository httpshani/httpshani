name: Atualizar visitas

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas
  workflow_dispatch:        # permite correr à mão no separador Actions

permissions:
  contents: write

jobs:
  visitas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler contador
        id: contador
        run: |
          SVG=$(curl -fsSL "https://komarev.com/ghpvc/?username=httpshani&style=flat")
          N=$(echo "$SVG" | grep -oE '>[0-9][0-9,.]*<' | tail -1 | tr -d '<>,.')
          if [ -z "$N" ]; then echo "Não foi possível ler o contador"; exit 1; fi
          # formato português: 1234 -> 1.234
          FMT=$(printf "%s" "$N" | rev | sed -E 's/([0-9]{3})/\1./g; s/\.$//' | rev)
          echo "n=$FMT" >> "$GITHUB_OUTPUT"

      - name: Atualizar README
        run: |
          sed -i -E "s|<!--VISITAS-->[^<]*<!--/VISITAS-->|<!--VISITAS-->${{ steps.contador.outputs.n }}<!--/VISITAS-->|" README.md

      - name: Commit
        run: |
          if git diff --quiet; then echo "Sem alterações"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: atualizar visitas"
          git push
