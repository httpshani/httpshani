<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616">
<style>
@font-face{font-family:JB;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:JBB;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:JBX;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:JB,ui-monospace,Menlo,Consolas,monospace;font-size:20px;fill:#E6EDF3;white-space:pre}
.t{font-size:13px;fill:#5B6B82} .p{fill:#4C8DFF} .cm{fill:#6B7C95}
.n{font-family:JBX,ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:84px;fill:#F2F4F8}
.h{fill:#E3B341} .hd{fill:#3FB950} .r{fill:#6B7C95}
.nm{font-family:JBB,ui-monospace,Menlo,Consolas,monospace;font-weight:700;fill:#F2F4F8}
.sb{font-size:13px;fill:#8B9BB4} .sbk{font-family:JBB,ui-monospace,monospace;font-weight:700;font-size:13px;fill:#0A0E16}
.f{opacity:0;animation:fade .6s ease-out forwards}
.sl{animation-name:slide}
.ln{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1s ease-out 4.2s forwards}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<defs>
<clipPath id="c1"><rect x="96" y="60" height="40" width="0"><animate attributeName="width" values="0;12;24;36;48;60;72" begin="0.4s" dur="0.6s" calcMode="discrete" fill="freeze"/></rect></clipPath>
<clipPath id="cn"><rect x="48" y="100" height="110" width="0"><animate attributeName="width" values="0.0;50.4;100.8;151.2;201.6;252.0" begin="1.1s" dur="0.75s" calcMode="discrete" fill="freeze"/></rect></clipPath>
<clipPath id="c2"><rect x="96" y="308" height="40" width="0"><animate attributeName="width" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300" begin="3.1s" dur="1.0s" calcMode="discrete" fill="freeze"/></rect></clipPath>
<clipPath id="win"><rect x="1" y="1" width="898" height="614" rx="14"/></clipPath>
<radialGradient id="glow" cx="0.15" cy="0.3" r="0.7"><stop offset="0" stop-color="#4C8DFF" stop-opacity=".11"/><stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0.9" cy="0.85" r="0.5"><stop offset="0" stop-color="#B084F5" stop-opacity=".06"/><stop offset="1" stop-color="#B084F5" stop-opacity="0"/></radialGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFFFFF" opacity=".018"/></pattern>
</defs>
<g clip-path="url(#win)">
<rect width="900" height="616" fill="#0A0E16"/>
<rect width="900" height="616" fill="url(#glow)"/><rect width="900" height="616" fill="url(#glow2)"/>
<rect width="900" height="616" fill="url(#scan)"/>
<!-- status bar -->
<g class="f" style="animation-delay:.2s">
<rect x="0" y="582" width="900" height="34" fill="#0D1320"/><path d="M0 582 H900" stroke="#1E2735"/>
<rect x="0" y="582" width="72" height="34" fill="#4C8DFF"/>
<text class="sbk" x="14" y="603.5">shani</text>
<text class="sb" x="88" y="603.5">~/projetos</text>
<text class="sb" x="880" y="603.5" text-anchor="end"><tspan fill="#3FB950">●</tspan> main  utf-8  zsh</text>
</g>
</g>
<rect x="1" y="1" width="898" height="614" rx="14" fill="none" stroke="#1E2735"/>
<path d="M1 44 H899" stroke="#1E2735"/>
<circle cx="26" cy="23" r="6" fill="#FF5F57"/><circle cx="46" cy="23" r="6" fill="#FEBC2E"/><circle cx="66" cy="23" r="6" fill="#28C840"/>
<text class="t" x="450.0" y="27.5" text-anchor="middle">@httpshani</text>
<!-- whoami -->
<text x="48" y="88" class="p">~$</text>
<text x="96" y="88" clip-path="url(#c1)">whoami</text>
<text class="n" x="44" y="180" clip-path="url(#cn)">shani</text>
<rect x="308.0" y="118" width="27.7" height="68" fill="#4C8DFF" opacity="0"><animate attributeName="opacity" values="1;0" dur="1.1s" begin="1.9s" end="3.1s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text class="cm f" style="animation-delay:2.1s" x="48" y="240">// Somos do tamanho dos nossos sonhos,</text>
<text class="cm f" style="animation-delay:2.35s" x="48" y="272">// e dentro de nós carregamos todos os sonhos do mundo.</text>
