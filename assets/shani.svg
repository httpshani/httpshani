<g class="f sl" style="animation-delay:4.56s"><circle cx="66" cy="458" r="5" fill="#0A0E16" stroke="#4C8DFF" stroke-width="1.5"/><text x="96" y="464"><tspan class="h">3c8e5a1</tspan> <tspan class="nm">xploit rp</tspan> <tspan class="r">- developer</tspan></text></g>
<g class="f sl" style="animation-delay:4.74s"><circle cx="66" cy="498" r="5" fill="#0A0E16" stroke="#4C8DFF" stroke-width="1.5"/><text x="96" y="504"><tspan class="h">0b2f4d9</tspan> <tspan class="nm">atlantic rp</tspan> <tspan class="r">- developer</tspan></text></g>
