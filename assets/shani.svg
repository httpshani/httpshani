<text x="48" y="558" class="p f" style="animation-delay:5.1s">~$</text>
<rect x="96" y="541" width="11" height="22" fill="#4C8DFF" opacity="0"><animate attributeName="opacity" values="1;0" dur="1.1s" begin="5.1s" calcMode="discrete" repeatCount="indefinite"/></rect>
</svg>